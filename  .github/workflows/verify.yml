name: Verify Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run structural tests
        run: node tests/verify.js
      - name: Verify SHA-256 hashes
        run: bash crypto/verificar.sh